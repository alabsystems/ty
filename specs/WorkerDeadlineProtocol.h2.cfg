\* Hazard h2: recv() forever instead of recv_timeout (UseDeadline = FALSE).
\* A diverging worker (non-polling solve) never signals -> main joins forever.
\* TY must report a DEADLOCK at main = "join".

CONSTANTS
    Budget = 3
    Reserve = 1
    BfsCost = 1
    WorkerCost = 4
    ChannelCap = 1
    WorkerMayDiverge = TRUE
    UseDeadline = FALSE
    IgnoreSendError = TRUE
    FirstWriterWins = TRUE
    ReserveBfsTail = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostResult
INVARIANT NoDoubleResolve
INVARIANT NoBlockedSend
