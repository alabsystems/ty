\* Shipped WORKER/DEADLINE/DETACH protocol: all four guards ON.
\* TY must certify this deadlock-free with every safety invariant holding.

CONSTANTS
    Budget = 3
    Reserve = 1
    BfsCost = 1
    WorkerCost = 4
    ChannelCap = 1
    WorkerMayDiverge = TRUE
    UseDeadline = TRUE
    IgnoreSendError = TRUE
    FirstWriterWins = TRUE
    ReserveBfsTail = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostResult
INVARIANT NoDoubleResolve
INVARIANT NoBlockedSend
