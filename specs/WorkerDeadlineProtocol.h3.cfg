\* Hazard h3: no first-writer-wins (FirstWriterWins = FALSE).
\* A formula resolved by the seeding worker is partial-flushed, then the final
\* BFS/output stage emits it again. TY must violate NoDoubleResolve (emits = 2).

CONSTANTS
    Budget = 3
    Reserve = 1
    BfsCost = 1
    WorkerCost = 4
    ChannelCap = 1
    WorkerMayDiverge = TRUE
    UseDeadline = TRUE
    IgnoreSendError = TRUE
    FirstWriterWins = FALSE
    ReserveBfsTail = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostResult
INVARIANT NoDoubleResolve
INVARIANT NoBlockedSend
