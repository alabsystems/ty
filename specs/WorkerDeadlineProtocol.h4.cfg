\* Hazard h4: no reserved BFS tail (ReserveBfsTail = FALSE).
\* The seeding worker eats the whole budget; when it overruns, the main thread
\* times out with zero budget left, so the sound BFS oracle never runs and the
\* verdict is lost. TY must violate NoLostResult. (The StateSpace regression class.)

CONSTANTS
    Budget = 3
    Reserve = 1
    BfsCost = 1
    WorkerCost = 4
    ChannelCap = 1
    WorkerMayDiverge = TRUE
    UseDeadline = TRUE
    IgnoreSendError = TRUE
    FirstWriterWins = TRUE
    ReserveBfsTail = FALSE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostResult
INVARIANT NoDoubleResolve
INVARIANT NoBlockedSend
