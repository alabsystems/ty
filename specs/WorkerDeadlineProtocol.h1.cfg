\* Hazard h1: blocking send into a buffer no one drains.
\* Rendezvous channel (ChannelCap = 0) + blocking send (IgnoreSendError = FALSE):
\* after the main thread detaches, the leaked worker wedges forever on send.
\* TY must violate NoBlockedSend. (Real code avoids this with sync_channel(1) +
\* `let _ = tx.send(..)`.)

CONSTANTS
    Budget = 3
    Reserve = 1
    BfsCost = 1
    WorkerCost = 4
    ChannelCap = 0
    WorkerMayDiverge = FALSE
    UseDeadline = TRUE
    IgnoreSendError = FALSE
    FirstWriterWins = TRUE
    ReserveBfsTail = TRUE

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoLostResult
INVARIANT NoDoubleResolve
INVARIANT NoBlockedSend
