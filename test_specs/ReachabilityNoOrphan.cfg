\* Reachability model checking configuration
\* Example: Small call graph with NO orphans

\* Define functions
CONSTANTS
    Functions = {"main", "init", "run", "helper"}
    EntryPoints = {"main"}
    Calls = [
        main |-> {"init", "run"},
        init |-> {"helper"},
        run |-> {"helper"},
        helper |-> {}
    ]

\* Check specification
SPECIFICATION Spec

\* Properties to verify
INVARIANT ExploredSubsetReachable
INVARIANT CallsValid

\* This should PASS (no orphans)
INVARIANT NoOrphans

\* Liveness property
PROPERTY Liveness
