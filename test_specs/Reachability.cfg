\* Reachability model checking configuration
\* Example: Small call graph with an orphan

\* Define functions
CONSTANTS
    Functions = {"main", "init", "run", "helper", "orphan"}
    EntryPoints = {"main"}
    Calls = [
        main |-> {"init", "run"},
        init |-> {"helper"},
        run |-> {"helper"},
        helper |-> {},
        orphan |-> {}
    ]

\* Check specification
SPECIFICATION Spec

\* Properties to verify
INVARIANT ExploredSubsetReachable
INVARIANT CallsValid

\* This should FAIL (orphan exists)
\* INVARIANT NoOrphans

\* Liveness property
\* PROPERTY Liveness
