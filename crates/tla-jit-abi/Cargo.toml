description = "Stable ABI types for TY JIT/AOT compilation (leaf crate)"
readme.workspace = true

[dependencies]
# Near-leaf crate. tla-* deps are `tla-core` (for `NameId`) and `tla-value`
# (for compound `Value` serialization to the flat i64 native state buffer — Part
# of #4267 Wave 11d). Neither crate depends on `tla-jit-abi`, so no cycle is
# introduced. Shared by tla-check, tla-ir, and tla-trust-cg.
# Part of #4265 (Stage 2b of epic #4251).
tla-core = { path = "../tla-core" }
tla-value = { path = "../tla-value" }
